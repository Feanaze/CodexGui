name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore CodexGui.csproj -r win-x64

      - name: Build
        run: dotnet build CodexGui.csproj -c Release -r win-x64 --no-restore

      - name: Check for secrets / session data
        shell: pwsh
        run: ./scripts/check-secrets.ps1 -Path .

      - name: Publish (single file, framework dependent)
        run: >
          dotnet publish CodexGui.csproj -c Release -r win-x64
          -p:PublishSingleFile=true -p:SelfContained=false -p:DebugType=none
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexGui-win-x64
          path: dist/
          if-no-files-found: error
